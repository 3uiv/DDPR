<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>DDPR OS</title>
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --accent:#4cc2ff;
  --accent-2:#2a8cf0;
  --glass:rgba(22,24,30,.72);
  --glass-2:rgba(30,33,40,.78);
  --stroke:rgba(255,255,255,.09);
  --stroke-2:rgba(255,255,255,.16);
  --txt:#f2f4f8;
  --txt-dim:rgba(242,244,248,.62);
  --txt-faint:rgba(242,244,248,.38);
  --radius:8px;
  --radius-lg:12px;
  --shadow:0 18px 50px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4);
  --taskbar-h:52px;
  --wall:radial-gradient(120% 90% at 22% 12%, #1d4a7a 0%, transparent 55%),
         radial-gradient(90% 80% at 82% 20%, #2b1f6b 0%, transparent 60%),
         radial-gradient(120% 110% at 55% 100%, #0b2d52 0%, transparent 65%),
         linear-gradient(160deg,#050a14 0%,#081426 45%,#040711 100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;overflow:hidden;background:#04070d;color:var(--txt);
  font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Inter",Roboto,Helvetica,Arial,sans-serif;
  font-size:14px;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::selection{background:var(--accent);color:#04070d}
.scroll{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.22) transparent}
.scroll::-webkit-scrollbar{width:10px;height:10px}
.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:10px;border:3px solid transparent;background-clip:content-box}
.scroll::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.32);background-clip:content-box}
.scroll::-webkit-scrollbar-track{background:transparent}

/* ============================================================
   BOOT
   ============================================================ */
#boot{
  position:fixed;inset:0;z-index:600;background:#000;overflow:hidden;
  transition:opacity .7s ease,visibility .7s ease;
}
#boot.done{opacity:0;visibility:hidden;pointer-events:none}
#boot-term{
  position:absolute;inset:0;padding:16px 18px;overflow:hidden;
  font-family:"Cascadia Code",Consolas,ui-monospace,"Courier New",monospace;
  font-size:11.5px;line-height:1.46;color:#8fe3b4;transition:opacity .5s ease,filter .5s ease;
}
#boot-term.fade{opacity:0;filter:blur(6px)}
#boot-term div{white-space:pre;overflow:hidden}
.bt-dim{color:rgba(150,205,255,.42)}
.bt-key{color:#7ee0ff}
.bt-warn{color:#ffce55}
.bt-ok{color:#39ff70;text-shadow:0 0 9px rgba(57,255,112,.65)}
.bt-big{font-size:14px;letter-spacing:1px}
.bt-caret{display:inline-block;width:8px;height:13px;background:#39ff70;vertical-align:-2px;animation:btcaret .5s steps(1) infinite}
@keyframes btcaret{0%,50%{opacity:1}51%,100%{opacity:0}}
#boot-flash{position:absolute;inset:0;background:#dff3ff;opacity:0;pointer-events:none}
#boot-flash.hit{animation:btflash .1s ease}
@keyframes btflash{0%{opacity:.42}100%{opacity:0}}
#boot-word{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:"Times New Roman",Times,serif;font-size:clamp(54px,13vw,136px);
  letter-spacing:.05em;pointer-events:none;
}
#boot-word span{opacity:0;transform:translateY(16px) scale(.9);filter:blur(12px);color:#fff;display:inline-block}
#boot-word span.in{animation:letterIn .8s cubic-bezier(.2,.9,.25,1) forwards}
@keyframes letterIn{
  60%{opacity:1;transform:translateY(0) scale(1.02);filter:blur(0);text-shadow:0 0 40px rgba(180,225,255,.85)}
  100%{opacity:1;transform:none;filter:blur(0);text-shadow:0 0 22px rgba(255,255,255,.45)}
}

/* ============================================================
   LOCK SCREEN
   ============================================================ */
#lock{
  position:fixed;inset:0;z-index:500;background:var(--wall);
  display:flex;flex-direction:column;align-items:center;
  transition:opacity .55s ease,transform .55s cubic-bezier(.2,.8,.2,1),visibility .55s;
}
#lock::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.28)}
#lock.lifted{transform:translateY(-14%);opacity:0;visibility:hidden;pointer-events:none}
.lock-clock{position:relative;z-index:2;margin-top:12vh;text-align:center;transition:opacity .45s ease,transform .45s ease}
.lock-clock.up{opacity:0;transform:translateY(-24px);pointer-events:none;position:absolute}
.lock-time{font-size:clamp(64px,12vw,124px);font-weight:600;letter-spacing:-2px;line-height:1;text-shadow:0 4px 30px rgba(0,0,0,.6)}
.lock-date{margin-top:6px;font-size:clamp(16px,2.4vw,24px);font-weight:400;color:rgba(255,255,255,.88);text-shadow:0 2px 12px rgba(0,0,0,.6)}
.lock-hint{margin-top:28px;font-size:13px;color:rgba(255,255,255,.6);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:.95}}
.lock-login{position:relative;z-index:2;margin-top:16vh;display:none;flex-direction:column;align-items:center;gap:14px;width:min(320px,86vw)}
.lock-login.show{display:flex;animation:riseIn .5s cubic-bezier(.2,.9,.25,1) both}
@keyframes riseIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
.avatar{
  width:108px;height:108px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(145deg,#3a7fd5,#7b4ddb);font-size:38px;font-weight:600;
  box-shadow:0 10px 34px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.28);letter-spacing:1px;
}
.lock-user{font-size:20px;font-weight:600}
.pin-row{display:flex;width:100%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:6px;overflow:hidden;backdrop-filter:blur(20px)}
.pin-row input{flex:1;background:none;border:none;outline:none;color:#fff;padding:11px 14px;font-size:14px}
.pin-row input::placeholder{color:rgba(255,255,255,.6)}
.pin-row button{width:44px;display:grid;place-items:center;background:rgba(255,255,255,.08);border-left:1px solid rgba(255,255,255,.18);transition:background .18s}
.pin-row button:hover{background:var(--accent);color:#04070d}
.lock-err{font-size:12.5px;color:#ffb4b4;min-height:16px}
.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.lock-foot{position:absolute;bottom:22px;right:24px;z-index:2;display:flex;gap:16px;color:rgba(255,255,255,.75);font-size:13px}

/* ============================================================
   DESKTOP
   ============================================================ */
#desktop{position:fixed;inset:0;background:var(--wall);background-size:cover;opacity:0;transition:opacity .7s ease}
#desktop.on{opacity:1}
#welcome{
  position:fixed;inset:0;z-index:400;display:grid;place-items:center;background:#050a14;
  opacity:0;visibility:hidden;transition:opacity .7s ease,visibility .7s;
}
#welcome.show{opacity:1;visibility:visible}
#welcome p{
  margin:0;font-size:clamp(34px,6vw,62px);font-weight:300;letter-spacing:.5px;
  text-shadow:0 0 26px rgba(120,200,255,.5);animation:welc 1.1s cubic-bezier(.2,.9,.25,1) both;
}
@keyframes welc{from{opacity:0;transform:translateY(16px) scale(.97);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}

/* desktop icons */
#icons{position:absolute;top:14px;left:14px;display:flex;flex-direction:column;flex-wrap:wrap;gap:4px;max-height:calc(100% - var(--taskbar-h) - 30px)}
.dicon{
  width:92px;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;
  border-radius:6px;border:1px solid transparent;text-align:center;transition:background .14s,border-color .14s;
}
.dicon:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.14)}
.dicon:active{transform:scale(.97)}
.dicon .gl{width:40px;height:40px}
.dicon span{font-size:12px;line-height:1.3;text-shadow:0 1px 4px rgba(0,0,0,.8);word-break:break-word}

/* glyph tiles */
.gl{border-radius:9px;display:grid;place-items:center;font-size:19px;font-weight:600;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.22);flex:none}
.gl.ddpr{background:linear-gradient(145deg,#1f6feb,#7b3fe4)}
.gl.arcade{background:linear-gradient(145deg,#ff6b6b,#c2255c)}
.gl.notes{background:linear-gradient(145deg,#ffd166,#f08c00);color:#3b2600}
.gl.calc{background:linear-gradient(145deg,#4dd4ac,#0ca678);color:#02241a}
.gl.settings{background:linear-gradient(145deg,#5f6b7a,#39424e)}
.gl.about{background:linear-gradient(145deg,#8e7bff,#4b32c3)}
.gl svg{width:58%;height:58%}
.gl.ddpr{background:#000;border:1px solid rgba(255,255,255,.22);box-shadow:0 4px 12px rgba(0,0,0,.5)}
.gl.ddpr svg{width:100%;height:100%}
.gl.browser{background:linear-gradient(145deg,#2f8fb5,#1a5f8a)}
.gl.about svg{width:46%;height:46%}

/* ============================================================
   WINDOWS
   ============================================================ */
#winlayer{position:absolute;inset:0 0 var(--taskbar-h) 0;pointer-events:none}
.win{
  position:absolute;pointer-events:auto;display:flex;flex-direction:column;min-width:300px;min-height:200px;
  background:var(--glass);backdrop-filter:blur(34px) saturate(160%);-webkit-backdrop-filter:blur(34px) saturate(160%);
  border:1px solid var(--stroke-2);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;
  animation:winIn .22s cubic-bezier(.2,.9,.25,1) both;
}
@keyframes winIn{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
.win.closing{animation:winOut .16s ease forwards}
@keyframes winOut{to{opacity:0;transform:scale(.95)}}
.win.minimized{animation:winMin .2s ease forwards;pointer-events:none}
@keyframes winMin{to{opacity:0;transform:translateY(70px) scale(.82)}}
.win.maxed{border-radius:0;border-color:transparent}
.win.snapping{transition:left .18s ease,top .18s ease,width .18s ease,height .18s ease}
.titlebar{
  height:38px;flex:none;display:flex;align-items:center;gap:9px;padding-left:12px;
  background:rgba(255,255,255,.035);border-bottom:1px solid var(--stroke);cursor:default;user-select:none;
}
.titlebar .gl{width:18px;height:18px;border-radius:5px;font-size:10px;box-shadow:none}
.titlebar b{font-weight:600;font-size:12.5px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbtns{margin-left:auto;display:flex;height:100%}
.wbtn{width:44px;display:grid;place-items:center;transition:background .13s}
.wbtn:hover{background:rgba(255,255,255,.1)}
.wbtn.close:hover{background:#c42b1c}
.wbtn svg{width:10px;height:10px;stroke:currentColor;stroke-width:1.2;fill:none}
.wbody{flex:1;min-height:0;display:flex;overflow:hidden}
.rs{position:absolute;z-index:5}
.rs.e{top:0;right:-3px;width:8px;height:100%;cursor:ew-resize}
.rs.s{bottom:-3px;left:0;height:8px;width:100%;cursor:ns-resize}
.rs.w{top:0;left:-3px;width:8px;height:100%;cursor:ew-resize}
.rs.n{top:-3px;left:0;height:8px;width:100%;cursor:ns-resize}
.rs.se{right:-3px;bottom:-3px;width:15px;height:15px;cursor:nwse-resize}
.rs.sw{left:-3px;bottom:-3px;width:15px;height:15px;cursor:nesw-resize}
#snaphint{
  position:absolute;z-index:1;border:2px solid var(--accent);background:rgba(76,194,255,.16);
  border-radius:var(--radius-lg);opacity:0;transition:all .15s ease;pointer-events:none;
}
#snaphint.on{opacity:1}

/* ============================================================
   TASKBAR
   ============================================================ */
#taskbar{
  position:absolute;left:0;right:0;bottom:0;height:var(--taskbar-h);z-index:200;
  display:flex;align-items:center;padding:0 10px;
  background:rgba(14,16,22,.76);backdrop-filter:blur(30px) saturate(170%);-webkit-backdrop-filter:blur(30px) saturate(170%);
  border-top:1px solid rgba(255,255,255,.07);
}
.tb-center{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:4px;align-items:center}
.tbtn{
  position:relative;width:42px;height:40px;border-radius:6px;display:grid;place-items:center;
  transition:background .15s,transform .15s;
}
.tbtn:hover{background:rgba(255,255,255,.1)}
.tbtn:active{transform:scale(.9)}
.tbtn .gl{width:26px;height:26px;border-radius:7px;font-size:12px}
.tbtn i{
  position:absolute;bottom:3px;left:50%;transform:translateX(-50%);height:3px;width:0;border-radius:3px;
  background:var(--accent);transition:width .22s cubic-bezier(.2,.9,.25,1),opacity .2s;opacity:.55;
}
.tbtn.open i{width:7px}
.tbtn.active i{width:17px;opacity:1}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:2px}
.tray{display:flex;align-items:center;gap:12px;padding:6px 10px;border-radius:6px;transition:background .15s}
.tray:hover{background:rgba(255,255,255,.1)}
.tray svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.5;opacity:.9}
#tb-clock{padding:6px 10px;border-radius:6px;text-align:right;line-height:1.35;font-size:12px;transition:background .15s}
#tb-clock:hover{background:rgba(255,255,255,.1)}
#tb-clock small{display:block;color:var(--txt-dim);font-size:11.5px}

/* start menu + panels */
.panel{
  position:absolute;z-index:210;background:var(--glass-2);backdrop-filter:blur(40px) saturate(170%);
  -webkit-backdrop-filter:blur(40px) saturate(170%);border:1px solid var(--stroke-2);border-radius:var(--radius-lg);
  box-shadow:var(--shadow);opacity:0;visibility:hidden;transform:translateY(16px) scale(.98);
  transition:opacity .2s ease,transform .24s cubic-bezier(.2,.9,.25,1),visibility .24s;
}
.panel.show{opacity:1;visibility:visible;transform:none}
#start{bottom:calc(var(--taskbar-h) + 8px);left:50%;margin-left:-min(48vw,300px);width:min(96vw,600px);max-height:70vh;padding:26px 30px 16px;display:flex;flex-direction:column}
#start-search{
  width:100%;padding:9px 14px;border-radius:20px;background:rgba(255,255,255,.07);
  border:1px solid var(--stroke-2);color:var(--txt);outline:none;font-size:13px;
}
#start-search:focus{border-color:var(--accent);background:rgba(255,255,255,.11)}
.start-lbl{margin:20px 0 10px;font-size:12.5px;font-weight:600;color:var(--txt-dim)}
#start-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:4px;overflow:auto;padding-bottom:6px}
.sapp{padding:14px 6px 11px;border-radius:7px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:background .14s,transform .14s}
.sapp:hover{background:rgba(255,255,255,.1)}
.sapp:active{transform:scale(.95)}
.sapp .gl{width:34px;height:34px}
.sapp span{font-size:11.5px;text-align:center;line-height:1.25}
.start-foot{margin-top:14px;padding-top:12px;border-top:1px solid var(--stroke);display:flex;align-items:center;gap:10px}
.start-foot .avatar{width:32px;height:32px;font-size:13px;box-shadow:none}
.start-foot b{font-size:13px;font-weight:500}
.start-foot .fbtns{margin-left:auto;display:flex;gap:2px}
.fbtn{width:34px;height:34px;border-radius:6px;display:grid;place-items:center;transition:background .14s}
.fbtn:hover{background:rgba(255,255,255,.12)}
.fbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6}
#quick{bottom:calc(var(--taskbar-h) + 8px);right:10px;width:min(92vw,330px);padding:18px}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qtile{padding:14px 8px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid var(--stroke);display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11.5px;transition:background .15s,border-color .15s}
.qtile.on{background:var(--accent);border-color:var(--accent);color:#04070d;font-weight:600}
.qtile:hover{background:rgba(255,255,255,.13)}
.qtile.on:hover{background:var(--accent-2);color:#fff}
.qtile svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6}
.qrow{margin-top:16px;display:flex;align-items:center;gap:11px;font-size:12px;color:var(--txt-dim)}
.qrow input[type=range]{flex:1;accent-color:var(--accent)}

/* ============================================================
   APP: DDPR
   ============================================================ */
.ddpr{display:flex;width:100%;min-height:0}
.ddpr-side{
  width:206px;flex:none;padding:12px 8px;overflow:auto;border-right:1px solid var(--stroke);
  background:rgba(0,0,0,.18);display:flex;flex-direction:column;gap:2px;
}
.ddpr-side h4{margin:6px 8px 8px;font-size:11.5px;font-weight:600;color:var(--txt-faint);letter-spacing:.3px}
.navi{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;position:relative;
  font-size:13px;text-align:left;width:100%;color:var(--txt-dim);transition:background .14s,color .14s;
}
.navi:hover{background:rgba(255,255,255,.07);color:var(--txt)}
.navi.on{background:rgba(255,255,255,.1);color:var(--txt);font-weight:600}
.navi.on::before{content:"";position:absolute;left:2px;top:50%;transform:translateY(-50%);width:3px;height:16px;border-radius:3px;background:var(--accent)}
.navi em{font-style:normal;font-size:15px;width:18px;text-align:center;flex:none}
.navi b{margin-left:auto;font-weight:500;font-size:11px;color:var(--txt-faint)}
.ddpr-main{flex:1;min-width:0;display:flex;flex-direction:column}
.ddpr-bar{padding:12px 18px;border-bottom:1px solid var(--stroke);display:flex;gap:10px;align-items:center;flex:none}
.ddpr-bar input{
  flex:1;min-width:0;padding:8px 13px;border-radius:18px;background:rgba(255,255,255,.07);
  border:1px solid var(--stroke-2);color:var(--txt);outline:none;font-size:13px;
}
.ddpr-bar input:focus{border-color:var(--accent);background:rgba(255,255,255,.11)}
.ddpr-bar .cnt{font-size:11.5px;color:var(--txt-faint);white-space:nowrap}
.ddpr-scroll{flex:1;overflow:auto;padding:20px 22px 34px}
.ddpr-hero{margin:0 0 22px}
.ddpr-hero h1{margin:0;font-size:26px;font-weight:600;letter-spacing:-.4px}
.ddpr-hero p{margin:6px 0 0;color:var(--txt-dim);font-size:13px;max-width:62ch;line-height:1.6}
.sect{margin-bottom:30px;scroll-margin-top:12px}
.sect > h3{
  margin:0 0 12px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:9px;
  padding-bottom:9px;border-bottom:1px solid var(--stroke);
}
.sect > h3 em{font-style:normal}
.sect > h3 b{margin-left:auto;font-size:11px;font-weight:500;color:var(--txt-faint)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:7px}
.tile{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:7px;
  background:rgba(255,255,255,.045);border:1px solid var(--stroke);color:var(--txt);
  text-decoration:none;font-size:12.5px;transition:background .14s,border-color .14s,transform .14s;
}
.tile:hover{background:rgba(255,255,255,.1);border-color:var(--stroke-2);transform:translateY(-1px)}
.tile .fav{
  width:22px;height:22px;flex:none;border-radius:5px;display:grid;place-items:center;
  font-size:10px;font-weight:700;background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.05));
  color:var(--txt);text-transform:uppercase;
}
.tile span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tile .out,.tile .inapp{opacity:0;transition:opacity .16s,background .16s;flex:none}
.tile .inapp{margin-left:auto;display:grid;place-items:center;width:20px;height:20px;border-radius:5px}
.tile .inapp:hover{background:rgba(255,255,255,.2);opacity:1}
.tile .out{margin-left:3px}
.tile:hover .inapp{opacity:.72}
.tile:hover .out{opacity:.5}
.tile .out svg,.tile .inapp svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.6;display:block}
.notice{
  padding:15px 17px;border-radius:8px;background:rgba(255,255,255,.04);
  border:1px solid var(--stroke);border-left:3px solid var(--accent);
  font-size:12.5px;line-height:1.75;color:var(--txt-dim);
}
.notice .socials{
  margin-top:14px;padding-top:12px;border-top:1px solid var(--stroke);
  color:var(--txt);font-weight:600;text-align:center;font-size:12px;
}
.empty{padding:40px 10px;text-align:center;color:var(--txt-faint);font-size:13px}

/* ============================================================
   APP: BROWSER
   ============================================================ */
.br{display:flex;flex-direction:column;width:100%;min-height:0}
.br-tabs{display:flex;align-items:center;gap:4px;padding:6px 8px 0;flex:none;overflow:hidden}
.br-tab{
  display:flex;align-items:center;gap:8px;max-width:190px;min-width:96px;padding:7px 9px;
  border-radius:7px 7px 0 0;background:rgba(255,255,255,.05);font-size:12px;
  transition:background .16s,transform .16s;
}

const hex=n=>"0x"+Array.from({length:n},()=>"0123456789ABCDEF"[(Math.random()*16)|0]).join("");
const pick=a=>a[(Math.random()*a.length)|0];
function bootLine(){
  const mods=["kernel","dxe","pci","nvme","acpi","usbhc","gfx","netif","crypto","vfs","sched","ddpr","smbios","tpm","hid"];
  const acts=["map","probe","init","attach","verify","alloc","mount","link","reset","flush","enum","patch"];
  const r=Math.random();
  if(r<.42) return `<span class="bt-dim">[${(performance.now()/1000).toFixed(6).padStart(11)}]</span> <span class="bt-key">${pick(mods)}</span>: ${pick(acts)} ${hex(8)} → ${hex(8)} <span class="bt-dim">len=${(Math.random()*65535|0)}</span>`;
  if(r<.62) return `<span class="bt-dim">  ${hex(4)}</span>  ${Array.from({length:8},()=>hex(2).slice(2)).join(" ")}   <span class="bt-dim">${Array.from({length:8},()=>pick(".-_+*#%@abcdef")).join("")}</span>`;
  if(r<.74) return `<span class="bt-key">ddpr</span>::<span>${pick(["registry","session","shell","surface","arcade","library","wm"])}</span> ${pick(["bind","spawn","resolve","cache"])}(<span class="bt-dim">${hex(6)}</span>) <span class="bt-ok">ok</span>`;
  if(r<.82) return `<span class="bt-warn">warn</span> ${pick(mods)}: retry ${(Math.random()*3|0)+1}/3 on ${hex(6)}`;
  if(r<.92) return `  ${pick(["const","let","fn","impl","use","static"])} ${pick(["surface","node","frame","buffer","atlas","handle"])}_${(Math.random()*99|0)} = ${pick(["load","mount","render","await sync","map"])}(${hex(4)});`;
  return `<span class="bt-dim">${"█".repeat((Math.random()*28|0)+4)}${"░".repeat((Math.random()*14|0))}</span> ${(Math.random()*100|0)}%`;
}
async function runBoot(){
  const term=$("#boot-term"), flash=$("#boot-flash"), word=$("#boot-word");
  const rows=Math.max(18,Math.floor(window.innerHeight/17));
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  let buf=[];
  const push=h=>{
    buf.push(h); if(buf.length>rows)buf.shift();
    term.innerHTML=buf.map(x=>"<div>"+x+"</div>").join("");
  };
  push('<span class="bt-key bt-big">DDPR OS</span> <span class="bt-dim">firmware 2.6.4 · initializing</span>');
  const burst=Math.round(rows*2.6);
  for(let i=0;i<burst;i++){
    push(bootLine());
    if(Math.random()<.06){flash.classList.remove("hit");void flash.offsetWidth;flash.classList.add("hit")}
    await wait(i<burst*.35?26:i<burst*.75?12:20);
  }
  push("");
  // typed confirmation
  const msg="Successfully loaded";
  const line=document.createElement("div");
  buf.push(""); if(buf.length>rows)buf.shift();
  term.innerHTML=buf.map(x=>"<div>"+x+"</div>").join("");
  term.appendChild(line);
  for(let i=0;i<=msg.length;i++){
    line.innerHTML=`<span class="bt-ok bt-big">${msg.slice(0,i)}</span><span class="bt-caret"></span>`;
    await wait(46);
  }
  line.innerHTML=`<span class="bt-ok bt-big">${msg}</span>`;
  await wait(620);
  term.classList.add("fade");
  await wait(520);
  const letters=[...word.querySelectorAll("span")];
  for(const l of letters){l.classList.add("in");await wait(430)}
  await wait(900);
  $("#boot").classList.add("done");
}
runBoot();

const layer=$("#winlayer"), hint=$("#snaphint");
let z=20, wins={}, cascade=0;

function openApp(key){
  const w=wins[key];
  if(w){
    if(w.min){restore(key)}else{focusWin(key)}
    return;
  }
  const a=APPS[key];
  const bounds=layer.getBoundingClientRect();
  const W=Math.min(a.w,bounds.width-30), H=Math.min(a.h,bounds.height-30);
  const off=(cascade++%6)*26;
  const node=el("div","win");
  node.style.width=W+"px"; node.style.height=H+"px";
  node.style.left=Math.max(10,(bounds.width-W)/2-70+off)+"px";
  node.style.top=Math.max(8,(bounds.height-H)/2-30+off)+"px";
  node.style.zIndex=++z;
  node.innerHTML=`
    <div class="titlebar">
      <span class="gl ${a.cls}">${ICONS[key]}</span><b>${a.name}</b>
      <div class="wbtns">
        <button class="wbtn mn" aria-label="Minimize"><svg viewBox="0 0 10 10"><path d="M1 5h8"/></svg></button>
        <button class="wbtn mx" aria-label="Maximize"><svg viewBox="0 0 10 10"><rect x="1" y="1" width="8" height="8" rx="1"/></svg></button>
        <button class="wbtn close" aria-label="Close"><svg viewBox="0 0 10 10"><path d="M1 1l8 8M9 1l-8 8"/></svg></button>
      </div>
    </div>
    <div class="wbody scroll"></div>
    <div class="rs n"></div><div class="rs e"></div><div class="rs s"></div><div class="rs w"></div>
    <div class="rs se"></div><div class="rs sw"></div>`;
  layer.appendChild(node);
  a.build(node.querySelector(".wbody"),node);

  const rec={node,key,min:false,max:false,prev:null,cleanup:null};
  wins[key]=rec;
  node.addEventListener("mousedown",()=>focusWin(key),true);
  node.addEventListener("touchstart",()=>focusWin(key),{passive:true,capture:true});
  node.querySelector(".close").addEventListener("click",()=>closeWin(key));
  node.querySelector(".mn").addEventListener("click",()=>minimize(key));
  node.querySelector(".mx").addEventListener("click",()=>toggleMax(key));
  node.querySelector(".titlebar").addEventListener("dblclick",e=>{if(!e.target.closest(".wbtn"))toggleMax(key)});
  dragWin(rec); resizeWin(rec);
  addTask(key); focusWin(key);
}
function closeWin(key){
  const r=wins[key]; if(!r)return;
  if(r.cleanup)r.cleanup();
  r.node.classList.add("closing");
  setTimeout(()=>r.node.remove(),170);
  delete wins[key]; removeTask(key);
  const rest=Object.keys(wins).filter(k=>!wins[k].min);
  if(rest.length)focusWin(rest[rest.length-1]);else paintTasks();
}
function minimize(key){
  const r=wins[key]; if(!r)return;
  r.min=true; r.node.classList.add("minimized");
  setTimeout(()=>{if(r.min)r.node.style.display="none"},200);
  paintTasks();
}
function restore(key){
  const r=wins[key]; if(!r)return;
  r.min=false; r.node.style.display="flex"; r.node.classList.remove("minimized");
  r.node.style.animation="winIn2 .3s cubic-bezier(.16,1,.3,1) both";
  focusWin(key);
}
function focusWin(key){
  const r=wins[key]; if(!r||r.min)return;
  r.node.style.zIndex=++z; paintTasks(key);
}
function topKey(){
  let best=null,bz=-1;
  for(const k in wins){const w=wins[k];if(!w.min&&+w.node.style.zIndex>bz){bz=+w.node.style.zIndex;best=k}}
  return best;
}
function toggleMax(key){
  const r=wins[key], n=r.node, b=layer.getBoundingClientRect();
  n.classList.add("snapping");
  if(r.max){
    const p=r.prev;
    n.style.left=p.l;n.style.top=p.t;n.style.width=p.w;n.style.height=p.h;
    n.classList.remove("maxed"); r.max=false;
  }else{
    r.prev={l:n.style.left,t:n.style.top,w:n.style.width,h:n.style.height};
    n.style.left="0px";n.style.top="0px";n.style.width=b.width+"px";n.style.height=b.height+"px";
    n.classList.add("maxed"); r.max=true;
  }
  setTimeout(()=>n.classList.remove("snapping"),200);
}
function pt(e){return e.touches?e.touches[0]:e}
function dragWin(r){
  const bar=r.node.querySelector(".titlebar");
  let sx,sy,ox,oy,on=false,snapTo=null;
  const down=e=>{
    if(e.target.closest(".wbtn"))return;
    const p=pt(e); on=true; sx=p.clientX; sy=p.clientY;
    if(r.max){ // un-maximize into the cursor
      const w=parseFloat(r.prev.w);
      toggleMax(r.key);
      r.node.style.left=Math.max(0,p.clientX-w/2)+"px";
      r.node.style.top=Math.max(0,p.clientY-19)+"px";
    }
    ox=r.node.offsetLeft; oy=r.node.offsetTop;
    document.addEventListener("mousemove",move);document.addEventListener("mouseup",up);
    document.addEventListener("touchmove",move,{passive:false});document.addEventListener("touchend",up);
    e.preventDefault();
  };
  const move=e=>{
    if(!on)return; const p=pt(e); e.preventDefault();
    const b=layer.getBoundingClientRect();
    let L=ox+p.clientX-sx, T=Math.max(0,oy+p.clientY-sy);
    L=Math.min(Math.max(L,-r.node.offsetWidth+120),b.width-120);
    r.node.style.left=L+"px"; r.node.style.top=T+"px";
    snapTo=null;
    if(p.clientY<=6)snapTo="max";
    else if(p.clientX<=6)snapTo="left";
    else if(p.clientX>=b.width-6)snapTo="right";
    if(snapTo){
      hint.classList.add("on");
      const half=b.width/2;
      hint.style.left=snapTo==="right"?half+"px":"0px";
      hint.style.top="0px";
      hint.style.width=(snapTo==="max"?b.width:half)+"px";
      hint.style.height=b.height+"px";
    }else hint.classList.remove("on");
  };
  const up=()=>{
    on=false; hint.classList.remove("on");
    document.removeEventListener("mousemove",move);document.removeEventListener("mouseup",up);
    document.removeEventListener("touchmove",move);document.removeEventListener("touchend",up);
    if(snapTo){
      const b=layer.getBoundingClientRect(), n=r.node;
      r.prev={l:n.style.left,t:n.style.top,w:n.style.width,h:n.style.height};
      n.classList.add("snapping");
      if(snapTo==="max"){n.style.left="0px";n.style.top="0px";n.style.width=b.width+"px";n.style.height=b.height+"px";n.classList.add("maxed");r.max=true}
      else{n.style.top="0px";n.style.height=b.height+"px";n.style.width=b.width/2+"px";n.style.left=(snapTo==="right"?b.width/2:0)+"px"}
      setTimeout(()=>n.classList.remove("snapping"),200);
      snapTo=null;
    }
  };
  bar.addEventListener("mousedown",down);
  bar.addEventListener("touchstart",down,{passive:false});
}
function resizeWin(r){
  r.node.querySelectorAll(".rs").forEach(h=>{
    const dir=h.className.replace("rs ","");
    const down=e=>{
      const p=pt(e); e.preventDefault(); e.stopPropagation();
      const n=r.node, sx=p.clientX, sy=p.clientY;
      const L=n.offsetLeft,T=n.offsetTop,W=n.offsetWidth,H=n.offsetHeight;
      const move=ev=>{
        const q=pt(ev); ev.preventDefault();
        const dx=q.clientX-sx, dy=q.clientY-sy;
        if(dir.includes("e"))n.style.width=Math.max(300,W+dx)+"px";
        if(dir.includes("s"))n.style.height=Math.max(200,H+dy)+"px";
        if(dir.includes("w")){const nw=Math.max(300,W-dx);n.style.width=nw+"px";n.style.left=L+(W-nw)+"px"}
        if(dir.includes("n")){const nh=Math.max(200,H-dy);n.style.height=nh+"px";n.style.top=Math.max(0,T+(H-nh))+"px"}
      };
      const up=()=>{
        document.removeEventListener("mousemove",move);document.removeEventListener("mouseup",up);
        document.removeEventListener("touchmove",move);document.removeEventListener("touchend",up);
      };
      document.addEventListener("mousemove",move);document.addEventListener("mouseup",up);
      document.addEventListener("touchmove",move,{passive:false});document.addEventListener("touchend",up);
    };
    h.addEventListener("mousedown",down);
    h.addEventListener("touchstart",down,{passive:false});
  });
}

function buildDDPR(body){
  const total=CATS.reduce((n,c)=>n+c.links.length,0);
  const wrap=el("div","ddpr");
  const side=el("aside","ddpr-side scroll");
  side.innerHTML='<h4>Library</h4>';
  const main=el("div","ddpr-main");
  main.innerHTML=`
    <div class="ddpr-bar">
      <button class="menu-btn" id="ddpr-menu" aria-label="Categories">☰</button>
      <input id="ddpr-q" placeholder="Search ${total} links" autocomplete="off">
      <span class="cnt" id="ddpr-cnt">${total} links · ${CATS.length} categories</span>
    </div>
    <div class="ddpr-scroll scroll" id="ddpr-scroll"></div>`;
  wrap.append(side,main); body.appendChild(wrap);

  const scroll=main.querySelector("#ddpr-scroll");
  const hero=el("header","ddpr-hero",`<h1>David Davis's Personal Repository</h1>
    <p>A personal directory of bookmarked third-party sites, organized by category. Pick a category on the left or search everything at once.</p>`);
  scroll.appendChild(hero);
  scroll.appendChild(el("div","sect",`<h3><em>${WARN}</em>Disclaimer</h3>
    <div class="notice"><p style="margin:0">${DISCLAIMER}</p><div class="socials">${SOCIALS}</div></div>`));

  CATS.forEach(c=>{
    const b=el("button","navi",`<em>${CATICON[c.id]}</em>${c.name}<b>${c.links.length}</b>`);
    b.addEventListener("click",()=>{
      side.classList.remove("open");
      const t=scroll.querySelector("#sect-"+c.id);
      if(t)t.scrollIntoView({behavior:"smooth",block:"start"});
    });
    side.appendChild(b);

    const s=el("section","sect");
    s.id="sect-"+c.id;
    s.innerHTML=`<h3><em>${CATICON[c.id]}</em>${c.name}<b>${c.links.length}</b></h3>`;
    const tiles=el("div","tiles");
    c.links.forEach(([label,href])=>{
      const a=el("a","tile",`<span class="fav">${label.replace(/^www\./,"")[0]}</span><span>${label}</span>
        <span class="inapp" title="Open in the built-in browser"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4"/><path d="M3.6 9.6h16.8M3.6 14.4h16.8"/><path d="M12 3.6c2.2 2.3 3.3 5.1 3.3 8.4S14.2 18.1 12 20.4c-2.2-2.3-3.3-5.1-3.3-8.4S9.8 5.9 12 3.6Z"/></svg></span>
        <span class="out" title="Open in a new tab"><svg viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></span>`);
      a.querySelector(".inapp").addEventListener("click",e=>{
        e.preventDefault();e.stopPropagation();
        openApp("browser");
        setTimeout(()=>{if(window.__browserOpen)window.__browserOpen(href)},90);
      });
      a.href=href; a.target="_blank"; a.rel="noopener noreferrer"; a.title=href;
      a.dataset.s=(label+" "+href).toLowerCase();
      tiles.appendChild(a);
    });
    s.appendChild(tiles); scroll.appendChild(s);
  });

  // active category highlight on scroll
  const navs=[...side.querySelectorAll(".navi")];
  const io=new IntersectionObserver(es=>{
    es.forEach(e=>{
      if(e.isIntersecting){
        const i=CATS.findIndex(c=>"sect-"+c.id===e.target.id);
        navs.forEach((n,j)=>n.classList.toggle("on",j===i));
      }
    });
  },{root:scroll,rootMargin:"-10% 0px -75% 0px"});
  scroll.querySelectorAll(".sect[id]").forEach(s=>io.observe(s));

  // search
  const q=main.querySelector("#ddpr-q"), cnt=main.querySelector("#ddpr-cnt");
  q.addEventListener("input",()=>{
    const v=q.value.toLowerCase().trim();
    let shown=0;
    scroll.querySelectorAll(".sect[id]").forEach(s=>{
      let n=0;
      s.querySelectorAll(".tile").forEach(a=>{
        const hit=!v||a.dataset.s.includes(v);
        a.style.display=hit?"":"none"; if(hit)n++;
      });
      s.style.display=n?"":"none";
      s.querySelector("h3 b").textContent=n;
      shown+=n;
    });
    hero.style.display=v?"none":"";
    cnt.textContent=v?`${shown} match${shown===1?"":"es"}`:`${total} links · ${CATS.length} categories`;
    let e=scroll.querySelector(".empty");
    if(!shown&&v){ if(!e){e=el("div","empty","No links match that search. Try a shorter word.");scroll.appendChild(e)} }
    else if(e)e.remove();
  });
  main.querySelector("#ddpr-menu").addEventListener("click",()=>side.classList.toggle("open"));
}

function buildBrowser(body){
  const w=el("div","br");
  w.innerHTML=`
    <div class="br-tabs" id="br-tabs"></div>
    <div class="br-bar">
      <button class="br-nav" id="br-back" title="Back"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg></button>
      <button class="br-nav" id="br-fwd" title="Forward"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
      <button class="br-nav" id="br-reload" title="Reload"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 4v4h-4"/></svg></button>
      <button class="br-nav" id="br-home" title="New tab page"><svg viewBox="0 0 24 24"><path d="m4 11 8-7 8 7"/><path d="M6.5 9.5V20h11V9.5"/></svg></button>
      <input class="br-url" id="br-url" placeholder="Search, or type a web address" autocomplete="off" spellcheck="false">
      <button class="br-nav" id="br-pop" title="Open in a real browser tab"><svg viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button>
    </div>
    <div class="br-view">
      <div class="br-load" id="br-load"></div>
      <div class="br-home scroll" id="br-home-page"></div>
      <div class="br-block" id="br-block">
        <b>This site refuses to load in a frame</b>
        <p>Most large sites send a header that blocks embedding, so they can only be viewed in a real browser tab. Everything else here keeps working.</p>
        <button class="pill" id="br-open">Open in a new tab</button>
      </div>
    </div>`;
  body.appendChild(w);

  const tabsEl=w.querySelector("#br-tabs"), viewEl=w.querySelector(".br-view");
  const urlEl=w.querySelector("#br-url"), loadEl=w.querySelector("#br-load");
  const blockEl=w.querySelector("#br-block"), homeEl=w.querySelector("#br-home-page");
  let tabs=[], act=0, timer=null;

  homeEl.innerHTML=`<h2>New tab</h2><p>Type an address above, or start from the repository.</p>`;
  const s=el("input","br-search");
  s.placeholder="Search the web"; s.autocomplete="off";
  s.addEventListener("keydown",e=>{if(e.key==="Enter"&&s.value.trim()){go(s.value.trim());s.value=""}});
  homeEl.appendChild(s);
  const quick=el("div","br-quick");
  CATS.forEach(c=>{
    const h=el("h4",null,c.name);
    const chips=el("div","br-chips");
    c.links.slice(0,14).forEach(([label,href])=>{
      const b=el("button","br-chip",label);
      b.addEventListener("click",()=>go(href));
      chips.appendChild(b);
    });
    quick.append(h,chips);
  });
  homeEl.appendChild(quick);

  const cur=()=>tabs[act];
  function newTab(url){
    const f=document.createElement("iframe");
    f.setAttribute("referrerpolicy","no-referrer");
    f.setAttribute("sandbox","allow-scripts allow-forms allow-popups allow-same-origin allow-popups-to-escape-sandbox");
    f.style.display="none";
    viewEl.appendChild(f);
    tabs.push({frame:f,hist:[],i:-1,title:"New tab"});
    act=tabs.length-1; paint();
    if(url)go(url); else showHome();
  }
  function closeTab(i){
    tabs[i].frame.remove(); tabs.splice(i,1);
    if(!tabs.length){newTab();return}
    act=Math.min(act,tabs.length-1); paint(); render();
  }
  function paint(){
    tabsEl.innerHTML="";
    tabs.forEach((t,i)=>{
      const b=el("button","br-tab"+(i===act?" on":""),`<i>${(t.title||"N")[0]}</i><span>${t.title||"New tab"}</span>`);
      const x=el("span","br-x","\u00d7");
      x.addEventListener("click",e=>{e.stopPropagation();closeTab(i)});
      b.appendChild(x);
      b.addEventListener("click",()=>{act=i;paint();render()});
      tabsEl.appendChild(b);
    });
    const plus=el("button","br-newtab","+");
    plus.title="New tab";
    plus.addEventListener("click",()=>newTab());
    tabsEl.appendChild(plus);
    const t=cur();
    w.querySelector("#br-back").disabled=!t||t.i<=0;
    w.querySelector("#br-fwd").disabled=!t||t.i>=t.hist.length-1;
  }
  function showHome(){
    clearTimeout(timer);
    tabs.forEach(t=>t.frame.style.display="none");
    homeEl.style.display="block"; blockEl.classList.remove("on");
    loadEl.style.width="0"; urlEl.value="";
    if(cur())cur().title="New tab";
    paint();
  }
  function render(){
    const t=cur(); if(!t)return;
    tabs.forEach((x,i)=>x.frame.style.display=(i===act&&x.i>=0)?"block":"none");
    if(t.i<0){showHome();return}
    homeEl.style.display="none";
    urlEl.value=t.hist[t.i];
    blockEl.classList.toggle("on",!!t.blocked);
    paint();
  }
  function normalize(v){
    v=(v||"").trim(); if(!v)return null;
    if(/^https?:\/\//i.test(v))return v;
    if(/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(v))return "https://"+v;
    return "https://duckduckgo.com/?q="+encodeURIComponent(v);
  }
  function go(v,push=true){
    const url=normalize(v); if(!url)return;
    const t=cur();
    if(push){t.hist=t.hist.slice(0,t.i+1);t.hist.push(url);t.i=t.hist.length-1}
    try{t.title=new URL(url).hostname.replace(/^www\./,"")}catch(e){t.title="Page"}
    t.blocked=false; t.loaded=false;
    homeEl.style.display="none"; blockEl.classList.remove("on");
    loadEl.style.opacity="1"; loadEl.style.width="18%";
    setTimeout(()=>{if(!t.loaded)loadEl.style.width="72%"},180);
    t.frame.style.display="block";
    t.frame.src=url;
    const finish=()=>{loadEl.style.width="100%";setTimeout(()=>{loadEl.style.opacity="0";loadEl.style.width="0"},340)};
    clearTimeout(timer);
    timer=setTimeout(()=>{
      if(!t.loaded){t.blocked=true;if(cur()===t)blockEl.classList.add("on")}
      finish();
    },2800);
    t.frame.onload=()=>{
      t.loaded=true;t.blocked=false;
      if(cur()===t)blockEl.classList.remove("on");
      finish();
    };
    render();
  }
  urlEl.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();go(urlEl.value)}});
  w.querySelector("#br-back").addEventListener("click",()=>{const t=cur();if(t.i>0){t.i--;go(t.hist[t.i],false)}});
  w.querySelector("#br-fwd").addEventListener("click",()=>{const t=cur();if(t.i<t.hist.length-1){t.i++;go(t.hist[t.i],false)}});
  w.querySelector("#br-reload").addEventListener("click",()=>{const t=cur();if(t.i>=0)go(t.hist[t.i],false)});
  w.querySelector("#br-home").addEventListener("click",()=>{const t=cur();t.i=-1;showHome()});
  const pop=()=>{const t=cur();if(t&&t.i>=0)window.open(t.hist[t.i],"_blank","noopener")};
  w.querySelector("#br-pop").addEventListener("click",pop);
  w.querySelector("#br-open").addEventListener("click",pop);
  newTab();
  window.__browserOpen=u=>newTab(u);
}

function buildArcade(body,node){
  const wrap=el("div","arc");
  const pick=el("div","arc-pick scroll");
  const stage=el("div","arc-stage");
  stage.innerHTML=`<div class="arc-top">
      <button class="pill" id="arc-back">← Games</button>
      <span>Score <b id="arc-score">0</b></span>
      <span>Best <b id="arc-best">0</b></span>
      <span class="sp"><button class="pill" id="arc-again">Restart</button></span>
    </div>
    <div id="arc-host" style="flex:1;min-height:0;display:grid;place-items:center;width:100%"></div>
    <div class="dpad" id="arc-dpad">
      <button data-d="left">◀</button><button data-d="up">▲</button>
      <button data-d="down">▼</button><button data-d="right">▶</button>
      <button data-d="space" style="width:62px;font-size:11px;letter-spacing:.5px">DROP</button>
    </div>
    <div class="arc-hint" id="arc-hint"></div>`;
  wrap.append(pick,stage); body.appendChild(wrap);

  GAMES.forEach(g=>{
    const c=el("button","gcard",`<div class="art" style="background:${g.art}">${g.icon}</div><b>${g.name}</b><small>${g.desc}</small>`);
    c.addEventListener("click",()=>launch(g));
    pick.appendChild(c);
  });

  let stop=null, current=null;
  const host=stage.querySelector("#arc-host");
  const scoreEl=stage.querySelector("#arc-score"), bestEl=stage.querySelector("#arc-best");
  const api={
    score(n){scoreEl.textContent=n;
      const b=store.get("best:"+current.id,0);
      if(n>b){store.set("best:"+current.id,n);bestEl.textContent=n}},
    host,dpad:stage.querySelector("#arc-dpad")
  };
  function launch(g){
    current=g;
    pick.style.display="none"; stage.classList.add("on");
    stage.querySelector("#arc-hint").textContent=g.keys;
    bestEl.textContent=store.get("best:"+g.id,0);
    scoreEl.textContent=0;
    if(stop)stop(); host.innerHTML="";
    stop=g.run(api,node);
  }
  stage.querySelector("#arc-back").addEventListener("click",()=>{
    if(stop){stop();stop=null}
    host.innerHTML=""; stage.classList.remove("on"); pick.style.display="";
  });
  stage.querySelector("#arc-again").addEventListener("click",()=>{if(current)launch(current)});
  const rec=()=>{if(stop)stop()};
  const check=setInterval(()=>{if(!document.body.contains(node)){rec();clearInterval(check)}},1000);
}
/* shared input helper — only fires while the arcade window is focused-ish */
function keyBinder(node,fn){
  const h=e=>{
    if(!document.body.contains(node))return;
    const k=e.key.toLowerCase();
    const map={arrowup:"up",w:"up",arrowdown:"down",s:"down",arrowleft:"left",a:"left",arrowright:"right",d:"right"," ":"space",enter:"space"};
    if(map[k]){e.preventDefault();fn(map[k])}
  };
  document.addEventListener("keydown",h);
  return ()=>document.removeEventListener("keydown",h);
}
function bindDpad(api,fn){
  const h=e=>{const b=e.target.closest("[data-d]");if(b)fn(b.dataset.d)};
  api.dpad.addEventListener("click",h);
  return ()=>api.dpad.removeEventListener("click",h);
}
function mkCanvas(api,w,h){
  const c=document.createElement("canvas");
  c.width=w;c.height=h;c.style.width="min(100%,"+w+"px)";
  api.host.appendChild(c);
  return c;
}

/* ---------- Maze Muncher ---------- */
const MAZE=[
"###############",
"#.....#.#.....#",
"#.###.#.#.###.#",
"#.#.........#.#",
"#.#.##.#.##.#.#",
"#......#......#",
"###.##.#.##.###",
"#.....G.G.....#",
"###.##.#.##.###",
"#......#......#",
"#.#.##.#.##.#.#",
"#.#.........#.#",
"#.###.#.#.###.#",
"#.....#P#.....#",
"###############"];
function runMuncher(api,node){
  const T=28, COLS=MAZE[0].length, ROWS=MAZE.length;
  const cv=mkCanvas(api,COLS*T,ROWS*T), g=cv.getContext("2d");
  let grid=MAZE.map(r=>r.split(""));
  let pellets=0, player={x:0,y:0,dx:0,dy:0,nx:0,ny:0,mouth:0}, ghosts=[], score=0, dead=false, won=false;
  grid.forEach((row,y)=>row.forEach((ch,x)=>{
    if(ch==="P"){player.x=x;player.y=y;grid[y][x]=" "}
    if(ch==="G"){ghosts.push({x,y,dx:0,dy:-1,c:ghosts.length?"#ff8ac2":"#7ee0ff"});grid[y][x]=" "}
    if(ch===".")pellets++;
  }));
  const wall=(x,y)=>x<0||y<0||x>=COLS||y>=ROWS||grid[y][x]==="#";
  const set=d=>{
    if(d==="up"){player.nx=0;player.ny=-1}
    if(d==="down"){player.nx=0;player.ny=1}
    if(d==="left"){player.nx=-1;player.ny=0}
    if(d==="right"){player.nx=1;player.ny=0}
  };
  const un1=keyBinder(node,set), un2=bindDpad(api,set);
  let acc=0,last=performance.now(),raf;
  function step(){
    if(!wall(player.x+player.nx,player.y+player.ny)&&(player.nx||player.ny)){player.dx=player.nx;player.dy=player.ny}
    if(!wall(player.x+player.dx,player.y+player.dy)){player.x+=player.dx;player.y+=player.dy}
    player.mouth=(player.mouth+1)%2;
    if(grid[player.y][player.x]==="."){grid[player.y][player.x]=" ";score+=10;pellets--;api.score(score);if(!pellets)won=true}
    ghosts.forEach(gh=>{
      const opts=[[1,0],[-1,0],[0,1],[0,-1]].filter(([dx,dy])=>!wall(gh.x+dx,gh.y+dy)&&!(dx===-gh.dx&&dy===-gh.dy));
      if(opts.length){
        let pickd;
        if(Math.random()<.72){
          opts.sort((a,b)=>Math.hypot(gh.x+a[0]-player.x,gh.y+a[1]-player.y)-Math.hypot(gh.x+b[0]-player.x,gh.y+b[1]-player.y));
          pickd=opts[0];
        }else pickd=opts[(Math.random()*opts.length)|0];
        gh.dx=pickd[0];gh.dy=pickd[1];
      }
      gh.x+=gh.dx;gh.y+=gh.dy;
      if(gh.x===player.x&&gh.y===player.y)dead=true;
    });
  }
  function draw(){
    g.fillStyle="#05080f";g.fillRect(0,0,cv.width,cv.height);
    for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
      if(grid[y][x]==="#"){
        g.fillStyle="#12306b";g.fillRect(x*T+2,y*T+2,T-4,T-4);
        g.strokeStyle="#4a8bff";g.lineWidth=1;g.strokeRect(x*T+2.5,y*T+2.5,T-5,T-5);
      }else if(grid[y][x]==="."){
        g.fillStyle="#ffe9a8";g.beginPath();g.arc(x*T+T/2,y*T+T/2,2.6,0,7);g.fill();
      }
    }
    const px=player.x*T+T/2,py=player.y*T+T/2;
    g.fillStyle="#ffd93d";g.beginPath();
    const ang=Math.atan2(player.dy,player.dx)||0, m=player.mouth?.34:.06;
    g.moveTo(px,py);g.arc(px,py,T/2-3,ang+m,ang-m+Math.PI*2);g.closePath();g.fill();
    ghosts.forEach(gh=>{
      const x=gh.x*T+T/2,y=gh.y*T+T/2,r=T/2-3;
      g.fillStyle=gh.c;g.beginPath();g.arc(x,y-1,r,Math.PI,0);g.lineTo(x+r,y+r-2);
      for(let i=0;i<3;i++)g.lineTo(x+r-((i*2+1)*r/3),y+r-2-(i%2?0:4));
      g.lineTo(x-r,y+r-2);g.closePath();g.fill();
      g.fillStyle="#04070d";g.beginPath();g.arc(x-3.5,y-2,2,0,7);g.arc(x+3.5,y-2,2,0,7);g.fill();
    });
    if(dead||won){
      g.fillStyle="rgba(3,6,12,.82)";g.fillRect(0,0,cv.width,cv.height);
      g.fillStyle="#fff";g.textAlign="center";
      g.font="600 26px Segoe UI,system-ui,sans-serif";
      g.fillText(won?"Maze cleared":"Caught",cv.width/2,cv.height/2-4);
      g.font="14px Segoe UI,system-ui,sans-serif";g.fillStyle="rgba(255,255,255,.7)";
      g.fillText("Score "+score+" — press Restart",cv.width/2,cv.height/2+24);
    }
  }
  function loop(t){
    raf=requestAnimationFrame(loop);
    if(document.hidden){last=t;return}
    acc+=t-last;last=t;
    if(acc>170&&!dead&&!won){acc=0;step();draw()}
  }
  draw(); raf=requestAnimationFrame(loop);
  return ()=>{cancelAnimationFrame(raf);un1();un2()};
}

/* ---------- Snake ---------- */
function runSnake(api,node){
  const T=22,N=20;
  const cv=mkCanvas(api,T*N,T*N), g=cv.getContext("2d");
  let snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}],dir={x:1,y:0},next={x:1,y:0},food=spawn(),score=0,over=false;
  function spawn(){let p;do{p={x:(Math.random()*N)|0,y:(Math.random()*N)|0}}while(snake&&snake.some(s=>s.x===p.x&&s.y===p.y));return p}
  const set=d=>{
    const m={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[d];
    if(!m)return;
    if(m.x===-dir.x&&m.y===-dir.y)return;
    next=m;
  };
  const un1=keyBinder(node,set), un2=bindDpad(api,set);
  let acc=0,last=performance.now(),raf;
  function step(){
    dir=next;
    const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y)){over=true;return}
    snake.unshift(h);
    if(h.x===food.x&&h.y===food.y){score+=10;api.score(score);food=spawn()}else snake.pop();
  }
  function draw(){
    g.fillStyle="#05080f";g.fillRect(0,0,cv.width,cv.height);
    g.strokeStyle="rgba(255,255,255,.035)";
    for(let i=1;i<N;i++){g.beginPath();g.moveTo(i*T,0);g.lineTo(i*T,cv.height);g.moveTo(0,i*T);g.lineTo(cv.width,i*T);g.stroke()}
    g.fillStyle="#ff6b6b";g.beginPath();g.arc(food.x*T+T/2,food.y*T+T/2,T/2-4,0,7);g.fill();
    snake.forEach((s,i)=>{
      g.fillStyle=i?`hsl(152 70% ${52-Math.min(i*1.1,26)}%)`:"#7ef7bd";
      g.beginPath();g.roundRect(s.x*T+2,s.y*T+2,T-4,T-4,i?4:6);g.fill();
    });
    if(over){
      g.fillStyle="rgba(3,6,12,.82)";g.fillRect(0,0,cv.width,cv.height);
      g.fillStyle="#fff";g.textAlign="center";g.font="600 26px Segoe UI,system-ui,sans-serif";
      g.fillText("Game over",cv.width/2,cv.height/2-4);
      g.font="14px Segoe UI,system-ui,sans-serif";g.fillStyle="rgba(255,255,255,.7)";
      g.fillText("Score "+score+" — press Restart",cv.width/2,cv.height/2+24);
    }
  }
  function loop(t){
    raf=requestAnimationFrame(loop);
    if(document.hidden){last=t;return}
    acc+=t-last;last=t;
    if(acc>105&&!over){acc=0;step();draw()}
  }
  draw(); raf=requestAnimationFrame(loop);
  return ()=>{cancelAnimationFrame(raf);un1();un2()};
}

/* ---------- Brick Breaker ---------- */
function runBreaker(api,node){
  const W=560,H=440;
  const cv=mkCanvas(api,W,H), g=cv.getContext("2d");
  const COLS=9,ROWS=5,BW=W/COLS-8;
  let bricks=[],pad={x:W/2-48,w:96,h:11},ball={x:W/2,y:H-60,vx:3.1,vy:-3.4,r:6},score=0,over=false,win=false,left=false,right=false;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)bricks.push({x:c*(BW+8)+4,y:r*26+40,w:BW,h:16,on:true,h2:r});
  const onMove=e=>{
    const rect=cv.getBoundingClientRect();
    const p=e.touches?e.touches[0]:e;
    pad.x=Math.max(0,Math.min(W-pad.w,(p.clientX-rect.left)*(W/rect.width)-pad.w/2));
  };
  cv.addEventListener("mousemove",onMove);
  cv.addEventListener("touchmove",e=>{e.preventDefault();onMove(e)},{passive:false});
  const kd=e=>{const k=e.key.toLowerCase();if(k==="arrowleft"||k==="a"){left=true;e.preventDefault()}if(k==="arrowright"||k==="d"){right=true;e.preventDefault()}};
  const ku=e=>{const k=e.key.toLowerCase();if(k==="arrowleft"||k==="a")left=false;if(k==="arrowright"||k==="d")right=false};
  document.addEventListener("keydown",kd);document.addEventListener("keyup",ku);
  const un2=bindDpad(api,d=>{if(d==="left")pad.x=Math.max(0,pad.x-34);if(d==="right")pad.x=Math.min(W-pad.w,pad.x+34)});
  let raf;
  function loop(){
    raf=requestAnimationFrame(loop);
    if(document.hidden)return;
    if(!over&&!win){
      if(left)pad.x=Math.max(0,pad.x-6);
      if(right)pad.x=Math.min(W-pad.w,pad.x+6);
      ball.x+=ball.vx;ball.y+=ball.vy;
      if(ball.x<ball.r||ball.x>W-ball.r)ball.vx*=-1;
      if(ball.y<ball.r)ball.vy*=-1;
      if(ball.y>H-26-pad.h&&ball.y<H-20&&ball.x>pad.x&&ball.x<pad.x+pad.w&&ball.vy>0){
        ball.vy*=-1;ball.vx+=((ball.x-(pad.x+pad.w/2))/pad.w)*3.4;
        ball.vx=Math.max(-6,Math.min(6,ball.vx));
      }
      if(ball.y>H+20)over=true;
      bricks.forEach(b=>{
        if(b.on&&ball.x>b.x-ball.r&&ball.x<b.x+b.w+ball.r&&ball.y>b.y-ball.r&&ball.y<b.y+b.h+ball.r){
          b.on=false;ball.vy*=-1;score+=10;api.score(score);
          if(!bricks.some(q=>q.on))win=true;
        }
      });
    }
    g.fillStyle="#05080f";g.fillRect(0,0,W,H);
    bricks.forEach(b=>{if(b.on){
      g.fillStyle=`hsl(${210+b.h2*26} 78% 58%)`;
      g.beginPath();g.roundRect(b.x,b.y,b.w,b.h,4);g.fill();
    }});
    g.fillStyle="#e9f2ff";g.beginPath();g.roundRect(pad.x,H-26,pad.w,pad.h,6);g.fill();
    g.fillStyle="#ffd93d";g.beginPath();g.arc(ball.x,ball.y,ball.r,0,7);g.fill();
    if(over||win){
      g.fillStyle="rgba(3,6,12,.82)";g.fillRect(0,0,W,H);
      g.fillStyle="#fff";g.textAlign="center";g.font="600 26px Segoe UI,system-ui,sans-serif";
      g.fillText(win?"All bricks cleared":"Ball lost",W/2,H/2-4);
      g.font="14px Segoe UI,system-ui,sans-serif";g.fillStyle="rgba(255,255,255,.7)";
      g.fillText("Score "+score+" — press Restart",W/2,H/2+24);
    }
  }
  raf=requestAnimationFrame(loop);
  return ()=>{cancelAnimationFrame(raf);document.removeEventListener("keydown",kd);document.removeEventListener("keyup",ku);un2()};
}

/* ---------- Tetris ---------- */
function runTetris(api,node){
  const C=10,R=20,T=22,SIDE=104;
  const cv=mkCanvas(api,C*T+SIDE,R*T), g=cv.getContext("2d");
  const SH={
    I:[[1,1,1,1]],O:[[1,1],[1,1]],T:[[0,1,0],[1,1,1]],
    S:[[0,1,1],[1,1,0]],Z:[[1,1,0],[0,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]]
  };
  const CL={I:"#4cc2ff",O:"#ffd93d",T:"#c792ff",S:"#7ee081",Z:"#ff7a7a",J:"#5b8cff",L:"#ffa94d"};
  let board=Array.from({length:R},()=>Array(C).fill(null));
  let bag=[],cur=null,nk=null,score=0,lines=0,level=1,over=false,acc=0,last=performance.now(),raf;
  const pull=()=>{if(!bag.length)bag=Object.keys(SH).sort(()=>Math.random()-.5);return bag.pop()};
  function spawn(){
    const k=nk||pull(); nk=pull();
    cur={k,m:SH[k].map(r=>[...r]),x:((C-SH[k][0].length)/2)|0,y:0};
    if(hit(cur.m,cur.x,cur.y))over=true;
  }
  function hit(m,x,y){
    for(let j=0;j<m.length;j++)for(let i=0;i<m[j].length;i++){
      if(!m[j][i])continue;
      const X=x+i,Y=y+j;
      if(X<0||X>=C||Y>=R)return true;
      if(Y>=0&&board[Y][X])return true;
    }
    return false;
  }
  function lock(){
    cur.m.forEach((r,j)=>r.forEach((v,i)=>{if(v&&cur.y+j>=0)board[cur.y+j][cur.x+i]=CL[cur.k]}));
    let n=0;
    for(let y=R-1;y>=0;y--)if(board[y].every(v=>v)){board.splice(y,1);board.unshift(Array(C).fill(null));n++;y++}
    if(n){lines+=n;score+=[0,100,300,500,800][n]*level;level=1+((lines/10)|0);api.score(score)}
    spawn();
  }
  function rotate(){
    const m=cur.m,w=m[0].length;
    const o=Array.from({length:w},(_,i)=>m.map(r=>r[i]).reverse());
    for(const k of [0,-1,1,-2,2])if(!hit(o,cur.x+k,cur.y)){cur.m=o;cur.x+=k;return}
  }
  function move(dx){if(!hit(cur.m,cur.x+dx,cur.y))cur.x+=dx}
  function down(){if(hit(cur.m,cur.x,cur.y+1)){lock();return false}cur.y++;return true}
  function hard(){while(down())score+=2;api.score(score);acc=0}
  const act=d=>{
    if(over)return;
    if(d==="left")move(-1); else if(d==="right")move(1);
    else if(d==="up")rotate(); else if(d==="down"){if(down())score+=1,api.score(score);acc=0}
    else if(d==="space")hard();
    draw();
  };
  const un1=keyBinder(node,act), un2=bindDpad(api,act);
  function cell(x,y,c,s=T){
    g.fillStyle=c;g.beginPath();g.roundRect(x+1,y+1,s-2,s-2,3);g.fill();
    g.fillStyle="rgba(255,255,255,.22)";g.fillRect(x+3,y+3,s-6,2);
  }
  function draw(){
    g.fillStyle="#05080f";g.fillRect(0,0,cv.width,cv.height);
    g.strokeStyle="rgba(255,255,255,.04)";g.lineWidth=1;
    for(let i=1;i<C;i++){g.beginPath();g.moveTo(i*T+.5,0);g.lineTo(i*T+.5,R*T);g.stroke()}
    for(let j=1;j<R;j++){g.beginPath();g.moveTo(0,j*T+.5);g.lineTo(C*T,j*T+.5);g.stroke()}
    board.forEach((row,y)=>row.forEach((c,x)=>{if(c)cell(x*T,y*T,c)}));
    if(cur&&!over){
      // ghost
      let gy=cur.y; while(!hit(cur.m,cur.x,gy+1))gy++;
      cur.m.forEach((r,j)=>r.forEach((v,i)=>{
        if(!v)return;
        g.strokeStyle="rgba(255,255,255,.2)";
        g.strokeRect(((cur.x+i)*T)+2.5,((gy+j)*T)+2.5,T-5,T-5);
      }));
      cur.m.forEach((r,j)=>r.forEach((v,i)=>{if(v&&cur.y+j>=0)cell((cur.x+i)*T,(cur.y+j)*T,CL[cur.k])}));
    }
    // side panel
    const sx=C*T+14;
    g.fillStyle="rgba(255,255,255,.55)";g.textAlign="left";g.font="11px Segoe UI,system-ui,sans-serif";
    g.fillText("NEXT",sx,22);
    if(nk){
      const m=SH[nk];
      m.forEach((r,j)=>r.forEach((v,i)=>{if(v)cell(sx+i*16,32+j*16,CL[nk],16)}));
    }
    g.fillStyle="rgba(255,255,255,.55)";
    g.fillText("LINES",sx,104); g.fillText("LEVEL",sx,146);
    g.fillStyle="#fff";g.font="600 20px Segoe UI,system-ui,sans-serif";
    g.fillText(lines,sx,126); g.fillText(level,sx,168);
    if(over){
      g.fillStyle="rgba(3,6,12,.84)";g.fillRect(0,0,cv.width,cv.height);
      g.fillStyle="#fff";g.textAlign="center";g.font="600 24px Segoe UI,system-ui,sans-serif";
      g.fillText("Stack topped out",cv.width/2,cv.height/2-4);
      g.font="13px Segoe UI,system-ui,sans-serif";g.fillStyle="rgba(255,255,255,.7)";
      g.fillText(score+" points · "+lines+" lines",cv.width/2,cv.height/2+22);
    }
  }
  spawn(); draw();
  function loop(t){
    raf=requestAnimationFrame(loop);
    if(document.hidden){last=t;return}
    acc+=t-last;last=t;
    const speed=Math.max(90,620-(level-1)*55);
    if(acc>speed&&!over){acc=0;down();draw()}
  }
  raf=requestAnimationFrame(loop);
  return ()=>{cancelAnimationFrame(raf);un1();un2()};
}

/* ---------- Pong ---------- */
function runPong(api,node){
  const W=560,H=360,PH=66,PW=10;
  const cv=mkCanvas(api,W,H), g=cv.getContext("2d");
  let you=H/2-PH/2, cpu=H/2-PH/2, up=false,dn=false, ys=0, cs=0, done=false;
  let b={x:W/2,y:H/2,vx:4.2,vy:2.6,r:6};
  const serve=d=>{b={x:W/2,y:H/2,vx:4.2*d,vy:(Math.random()*3.4-1.7),r:6}};
  const onMove=e=>{
    const rect=cv.getBoundingClientRect(), p=e.touches?e.touches[0]:e;
    you=Math.max(0,Math.min(H-PH,(p.clientY-rect.top)*(H/rect.height)-PH/2));
  };
  cv.addEventListener("mousemove",onMove);
  cv.addEventListener("touchmove",e=>{e.preventDefault();onMove(e)},{passive:false});
  const kd=e=>{const k=e.key.toLowerCase();if(k==="arrowup"||k==="w"){up=true;e.preventDefault()}if(k==="arrowdown"||k==="s"){dn=true;e.preventDefault()}};
  const ku=e=>{const k=e.key.toLowerCase();if(k==="arrowup"||k==="w")up=false;if(k==="arrowdown"||k==="s")dn=false};
  document.addEventListener("keydown",kd);document.addEventListener("keyup",ku);
  const un2=bindDpad(api,d=>{if(d==="up")you=Math.max(0,you-34);if(d==="down")you=Math.min(H-PH,you+34)});
  let raf;
  function loop(){
    raf=requestAnimationFrame(loop);
    if(document.hidden)return;
    if(!done){
      if(up)you=Math.max(0,you-6);
      if(dn)you=Math.min(H-PH,you+6);
      const target=b.y-PH/2+(Math.sin(performance.now()/420)*14);
      cpu+=Math.max(-4.1,Math.min(4.1,target-cpu))*0.5;
      cpu=Math.max(0,Math.min(H-PH,cpu));
      b.x+=b.vx;b.y+=b.vy;
      if(b.y<b.r||b.y>H-b.r)b.vy*=-1;
      if(b.x-b.r<20+PW&&b.y>you&&b.y<you+PH&&b.vx<0){b.vx=Math.abs(b.vx)*1.04;b.vy+=(b.y-(you+PH/2))/16}
      if(b.x+b.r>W-20-PW&&b.y>cpu&&b.y<cpu+PH&&b.vx>0){b.vx=-Math.abs(b.vx)*1.04;b.vy+=(b.y-(cpu+PH/2))/16}
      if(b.x<-20){cs++;serve(1)}
      if(b.x>W+20){ys++;api.score(ys);serve(-1)}
      if(ys>=7||cs>=7)done=true;
    }
    g.fillStyle="#05080f";g.fillRect(0,0,W,H);
    g.strokeStyle="rgba(255,255,255,.14)";g.setLineDash([7,11]);g.lineWidth=2;
    g.beginPath();g.moveTo(W/2,0);g.lineTo(W/2,H);g.stroke();g.setLineDash([]);
    g.fillStyle="rgba(255,255,255,.3)";g.textAlign="center";g.font="600 34px Segoe UI,system-ui,sans-serif";
    g.fillText(ys,W/2-46,48);g.fillText(cs,W/2+46,48);
    g.fillStyle="#e9f2ff";g.beginPath();g.roundRect(20,you,PW,PH,5);g.fill();
    g.fillStyle="#7ee0ff";g.beginPath();g.roundRect(W-20-PW,cpu,PW,PH,5);g.fill();
    g.fillStyle="#ffd93d";g.beginPath();g.arc(b.x,b.y,b.r,0,7);g.fill();
    if(done){
      g.fillStyle="rgba(3,6,12,.84)";g.fillRect(0,0,W,H);
      g.fillStyle="#fff";g.font="600 26px Segoe UI,system-ui,sans-serif";
      g.fillText(ys>cs?"You win":"House wins",W/2,H/2-4);
      g.font="13px Segoe UI,system-ui,sans-serif";g.fillStyle="rgba(255,255,255,.7)";
      g.fillText(ys+" – "+cs+" · press Restart",W/2,H/2+22);
    }
  }
  raf=requestAnimationFrame(loop);
  return ()=>{cancelAnimationFrame(raf);document.removeEventListener("keydown",kd);document.removeEventListener("keyup",ku);un2()};
}

/* ---------- Minesweeper ---------- */
function runMine(api,node){
  const N=10,MINES=12;
  const wrap=el("div","");
  wrap.style.cssText="display:flex;flex-direction:column;align-items:center;gap:10px";
  const status=el("div","","12 mines left");
  status.style.cssText="font-size:12.5px;color:var(--txt-dim)";
  const grid=el("div","mine-grid");
  grid.style.gridTemplateColumns=`repeat(${N},28px)`;
  wrap.append(status,grid); api.host.appendChild(wrap);
  let mines,open,flag,done,started,revealed;
  function reset(){
    mines=Array.from({length:N},()=>Array(N).fill(false));
    open=Array.from({length:N},()=>Array(N).fill(false));
    flag=Array.from({length:N},()=>Array(N).fill(false));
    done=false;started=false;revealed=0;api.score(0);paint();
  }
  function plant(sx,sy){
    let left=MINES;
    while(left){
      const x=(Math.random()*N)|0,y=(Math.random()*N)|0;
      if(mines[y][x]||(Math.abs(x-sx)<2&&Math.abs(y-sy)<2))continue;
      mines[y][x]=true;left--;
    }
    started=true;
  }
  const near=(x,y)=>{
    let n=0;
    for(let j=-1;j<2;j++)for(let i=-1;i<2;i++){
      const X=x+i,Y=y+j;
      if(X>=0&&Y>=0&&X<N&&Y<N&&mines[Y][X])n++;
    }
    return n;
  };
  function reveal(x,y){
    if(x<0||y<0||x>=N||y>=N||open[y][x]||flag[y][x])return;
    open[y][x]=true;revealed++;
    if(near(x,y)===0&&!mines[y][x])
      for(let j=-1;j<2;j++)for(let i=-1;i<2;i++)if(i||j)reveal(x+i,y+j);
  }
  function paint(){
    grid.innerHTML="";
    const COLORS=["","#7ee0ff","#7ee081","#ffd93d","#ffa94d","#ff7a7a","#c792ff","#ff8ac2","#ffffff"];
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){
      const b=el("button","mc");
      if(open[y][x]){
        b.classList.add("open");
        if(mines[y][x]){b.classList.add("boom");b.textContent="•"}
        else{const n=near(x,y);if(n){b.textContent=n;b.style.color=COLORS[n]}}
      }else if(flag[y][x]){b.classList.add("flag");b.textContent="!"}
      b.addEventListener("click",()=>{
        if(done||open[y][x]||flag[y][x])return;
        if(!started)plant(x,y);
        if(mines[y][x]){
          done=true;
          for(let j=0;j<N;j++)for(let i=0;i<N;i++)if(mines[j][i])open[j][i]=true;
          status.textContent="Hit a mine. Press Restart.";
        }else{
          reveal(x,y);api.score(revealed*10);
          if(revealed===N*N-MINES){done=true;status.textContent="Field cleared."}
        }
        paint();
      });
      b.addEventListener("contextmenu",e=>{
        e.preventDefault();
        if(done||open[y][x])return;
        flag[y][x]=!flag[y][x];paint();
      });
      let lp;
      b.addEventListener("touchstart",()=>{lp=setTimeout(()=>{if(!done&&!open[y][x]){flag[y][x]=!flag[y][x];paint()}},450)},{passive:true});
      b.addEventListener("touchend",()=>clearTimeout(lp));
      grid.appendChild(b);
    }
    if(!done){
      const f=flag.flat().filter(Boolean).length;
      status.textContent=`${MINES-f} mines left`;
    }
  }
  reset();
  return ()=>wrap.remove();
}

/* ---------- Star Defender ---------- */
function runDefender(api,node){
  const W=520,H=440;
  const cv=mkCanvas(api,W,H), g=cv.getContext("2d");
  let ship={x:W/2,w:34,h:14},shots=[],foes=[],parts=[],score=0,lives=3,wave=1,over=false;
  let left=false,right=false,fireHeld=false,cool=0,raf,t0=performance.now();
  function makeWave(){
    foes=[];
    const cols=Math.min(9,5+wave),rows=Math.min(4,1+((wave/2)|0));
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)
      foes.push({x:40+c*((W-80)/Math.max(1,cols-1)),y:46+r*38,r:11,v:.28+wave*.06,ph:Math.random()*6});
  }
  makeWave();
  const act=d=>{
    if(d==="left")left=true; if(d==="right")right=true;
    if(d==="space")fire();
    setTimeout(()=>{if(d==="left")left=false;if(d==="right")right=false},120);
  };
  const un2=bindDpad(api,act);
  const kd=e=>{
    const k=e.key.toLowerCase();
    if(k==="arrowleft"||k==="a"){left=true;e.preventDefault()}
    if(k==="arrowright"||k==="d"){right=true;e.preventDefault()}
    if(k===" "||k==="arrowup"||k==="w"){fireHeld=true;e.preventDefault()}
  };
  const ku=e=>{
    const k=e.key.toLowerCase();
    if(k==="arrowleft"||k==="a")left=false;
    if(k==="arrowright"||k==="d")right=false;
    if(k===" "||k==="arrowup"||k==="w")fireHeld=false;
  };
  document.addEventListener("keydown",kd);document.addEventListener("keyup",ku);
  const onMove=e=>{const r=cv.getBoundingClientRect(),p=e.touches?e.touches[0]:e;ship.x=Math.max(20,Math.min(W-20,(p.clientX-r.left)*(W/r.width)))};
  cv.addEventListener("mousemove",onMove);
  cv.addEventListener("touchmove",e=>{e.preventDefault();onMove(e)},{passive:false});
  cv.addEventListener("click",()=>fire());
  function fire(){if(cool>0||over)return;shots.push({x:ship.x,y:H-40,v:-7.4});cool=11}
  function burst(x,y,c){for(let i=0;i<12;i++)parts.push({x,y,vx:(Math.random()-.5)*4.4,vy:(Math.random()-.5)*4.4,l:26,c})}
  function loop(){
    raf=requestAnimationFrame(loop);
    if(document.hidden)return;
    if(!over){
      if(left)ship.x=Math.max(20,ship.x-5.4);
      if(right)ship.x=Math.min(W-20,ship.x+5.4);
      if(fireHeld)fire();
      if(cool>0)cool--;
      shots.forEach(s=>s.y+=s.v);
      shots=shots.filter(s=>s.y>-10);
      const tt=performance.now()/500;
      foes.forEach(f=>{f.y+=f.v;f.x+=Math.sin(tt+f.ph)*.8});
      foes.forEach(f=>{
        shots.forEach(s=>{
          if(!f.dead&&Math.hypot(s.x-f.x,s.y-f.y)<f.r+4){f.dead=true;s.y=-99;score+=25;api.score(score);burst(f.x,f.y,"#7ee0ff")}
        });
        if(!f.dead&&f.y>H-46&&Math.abs(f.x-ship.x)<26){f.dead=true;lives--;burst(ship.x,H-30,"#ff7a7a");if(lives<=0)over=true}
        if(f.y>H+20){f.dead=true;lives--;if(lives<=0)over=true}
      });
      foes=foes.filter(f=>!f.dead);
      shots=shots.filter(s=>s.y>-10);
      parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.l--});
      parts=parts.filter(p=>p.l>0);
      if(!foes.length){wave++;score+=100;api.score(score);makeWave()}
    }
    g.fillStyle="#05080f";g.fillRect(0,0,W,H);
    const tt=(performance.now()-t0)/40;
    g.fillStyle="rgba(255,255,255,.25)";
    for(let i=0;i<46;i++){
      const x=(i*97)%W, y=((i*53)+tt)%H;
      g.fillRect(x,y,1.4,1.4);
    }
    foes.forEach(f=>{
      g.fillStyle="#ff8ac2";g.beginPath();g.moveTo(f.x,f.y+f.r);g.lineTo(f.x-f.r,f.y-f.r*.6);g.lineTo(f.x+f.r,f.y-f.r*.6);g.closePath();g.fill();
      g.fillStyle="rgba(255,255,255,.75)";g.fillRect(f.x-2,f.y-3,4,3);
    });
    g.fillStyle="#ffd93d";shots.forEach(s=>g.fillRect(s.x-1.6,s.y,3.2,10));
    parts.forEach(p=>{g.globalAlpha=p.l/26;g.fillStyle=p.c;g.fillRect(p.x,p.y,2.6,2.6);g.globalAlpha=1});
    g.fillStyle="#e9f2ff";g.beginPath();
    g.moveTo(ship.x,H-42);g.lineTo(ship.x-17,H-22);g.lineTo(ship.x+17,H-22);g.closePath();g.fill();
    g.fillStyle="rgba(255,255,255,.55)";g.textAlign="left";g.font="12px Segoe UI,system-ui,sans-serif";
    g.fillText("Wave "+wave+"   Lives "+Math.max(0,lives),12,20);
    if(over){
      g.fillStyle="rgba(3,6,12,.84)";g.fillRect(0,0,W,H);
      g.textAlign="center";g.fillStyle="#fff";g.font="600 26px Segoe UI,system-ui,sans-serif";
      g.fillText("Line broken",W/2,H/2-4);
      g.font="13px Segoe UI,system-ui,sans-serif";g.fillStyle="rgba(255,255,255,.7)";
      g.fillText("Wave "+wave+" · "+score+" points · press Restart",W/2,H/2+22);
    }
  }
  raf=requestAnimationFrame(loop);
  return ()=>{cancelAnimationFrame(raf);document.removeEventListener("keydown",kd);document.removeEventListener("keyup",ku);un2()};
}

  let deck=[],flip=[],found=0,moves=0,busy=false;
  function reset(){
    deck=[...Array(PAIRS).keys(),...Array(PAIRS).keys()]
      .map(v=>({v,open:false,done:false}))
      .sort(()=>Math.random()-.5);
    flip=[];found=0;moves=0;busy=false;api.score(0);paint();
  }
  function paint(){
    grid.innerHTML="";
    deck.forEach((c,i)=>{
      const b=el("button","");
      const shown=c.open||c.done;
      b.style.cssText=`width:68px;height:78px;border-radius:9px;border:1px solid var(--stroke-2);

        transform:rotateY(${shown?0:0}deg) scale(${c.done?.94:1});opacity:${c.done?.55:1}`;
      b.addEventListener("click",()=>{
        if(busy||c.open||c.done)return;
        c.open=true;flip.push(c);paint();

          busy=true;moves++;
          const [a,d]=flip;
          setTimeout(()=>{
            if(a.v===d.v){a.done=d.done=true;found++;api.score(Math.max(0,found*100-moves*5))}
            a.open=d.open=false;flip=[];busy=false;paint();
            if(found===PAIRS)info.textContent=`All pairs found in ${moves} moves.`;
          },a.v===d.v?320:620);
        }
      });
      grid.appendChild(b);
    });
    if(found<PAIRS)info.textContent=`${found} of ${PAIRS} pairs · ${moves} moves`;
  }
  reset();
  return ()=>wrap.remove();
}

/* ---------- Tic-Tac-Toe ---------- */
function runTTT(api){
  const wrap=el("div","");
  wrap.style.cssText="display:flex;flex-direction:column;align-items:center;gap:12px";
  const info=el("div","");
  info.style.cssText="font-size:12.5px;color:var(--txt-dim)";
  const grid=el("div","");
  grid.style.cssText="display:grid;grid-template-columns:repeat(3,76px);gap:6px";
  wrap.append(info,grid); api.host.appendChild(wrap);
  const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  let b,done,wins=0;
  const winner=s=>{for(const l of LINES){const[a,c,d]=l;if(s[a]&&s[a]===s[c]&&s[a]===s[d])return s[a]}return s.includes(null)?null:"tie"};
  function best(s,me){
    const w=winner(s);
    if(w==="O")return{sc:1};if(w==="X")return{sc:-1};if(w==="tie")return{sc:0};
    let out=null;
    s.forEach((v,i)=>{
      if(v)return;
      s[i]=me?"O":"X";
      const r=best(s,!me).sc;
      s[i]=null;
      if(!out||(me?r>out.sc:r<out.sc))out={sc:r,i};
    });
    return out;
  }
  function reset(){b=Array(9).fill(null);done=false;info.textContent="You are X — your move.";paint()}
  function paint(){
    grid.innerHTML="";
    b.forEach((v,i)=>{
      const c=el("button","",v||"");
      c.style.cssText=`width:76px;height:76px;border-radius:9px;border:1px solid var(--stroke-2);
        background:rgba(255,255,255,.055);font-size:30px;font-weight:600;
        color:${v==="X"?"#7ee0ff":"#ff8ac2"};transition:background .15s,transform .15s`;
      c.addEventListener("mouseenter",()=>{if(!v&&!done)c.style.background="rgba(255,255,255,.13)"});
      c.addEventListener("mouseleave",()=>c.style.background="rgba(255,255,255,.055)");
      c.addEventListener("click",()=>{
        if(done||b[i])return;
        b[i]="X";step();
      });
      grid.appendChild(c);
    });
  }
  function step(){
    let w=winner(b);
    if(!w){
      const m=best([...b],true);
      if(m&&m.i!==undefined)b[m.i]="O";
      w=winner(b);
    }
    paint();
    if(w){
      done=true;
      info.textContent=w==="tie"?"Draw. Press Restart.":w==="X"?"You win.":"Opponent wins.";
      if(w==="X"){wins++;api.score(wins*100)}
    }
  }
  reset();
  return ()=>wrap.remove();
}

/* ---------- Sequence ---------- */
function runSequence(api){
  const wrap=el("div","");
  wrap.style.cssText="display:flex;flex-direction:column;align-items:center;gap:14px";
  const info=el("div","");
  info.style.cssText="font-size:12.5px;color:var(--txt-dim)";
  const grid=el("div","");
  grid.style.cssText="display:grid;grid-template-columns:repeat(2,96px);gap:10px";
  const btn=el("button","pill","Start");
  wrap.append(info,grid,btn); api.host.appendChild(wrap);
  const COL=["#4cc2ff","#ff7a7a","#7ee081","#ffc14d"];
  let seq=[],step=0,lock=true,pads=[],timers=[];
  COL.forEach((c,i)=>{
    const p=el("button","");
    p.style.cssText=`width:96px;height:96px;border-radius:14px;background:${c};opacity:.34;
      border:1px solid rgba(255,255,255,.2);transition:opacity .16s,transform .16s`;
    p.addEventListener("click",()=>hit(i));
    p.addEventListener("mouseenter",()=>{if(!lock)p.style.transform="scale(1.03)"});
    p.addEventListener("mouseleave",()=>p.style.transform="none");
    pads.push(p); grid.appendChild(p);
  });
  const glow=i=>{pads[i].style.opacity="1";timers.push(setTimeout(()=>pads[i].style.opacity=".34",300))};
  function play(){
    lock=true; info.textContent="Watch...";
    seq.forEach((v,i)=>timers.push(setTimeout(()=>glow(v),i*560+400)));
    timers.push(setTimeout(()=>{lock=false;step=0;info.textContent=`Your turn — ${seq.length} in the pattern`},seq.length*560+500));
  }
  function next(){seq.push((Math.random()*4)|0);api.score((seq.length-1)*50);play()}
  function hit(i){
    if(lock)return;
    glow(i);
    if(seq[step]===i){
      step++;
      if(step===seq.length){lock=true;info.textContent="Correct.";timers.push(setTimeout(next,700))}
    }else{
      lock=true;info.textContent=`Wrong pad. You reached ${seq.length-1}. Press Start to try again.`;
      seq=[];btn.textContent="Start";
    }
  }
  btn.addEventListener("click",()=>{timers.forEach(clearTimeout);timers=[];seq=[];btn.textContent="Restart run";next()});
  info.textContent="Press Start.";
  return ()=>{timers.forEach(clearTimeout);wrap.remove()};
}

/* ---------- 2048 ---------- */
function run2048(api,node){
  const box=el("div","");
  box.style.cssText="display:grid;grid-template-columns:repeat(4,72px);grid-auto-rows:72px;gap:8px;padding:8px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--stroke-2)";
  api.host.appendChild(box);
  const COL={2:"#3b4757",4:"#3f5570",8:"#2f74b5",16:"#2f8fb5",32:"#2fb59a",64:"#3fb56a",128:"#95b52f",256:"#b5952f",512:"#b56a2f",1024:"#b5452f",2048:"#b52f7a"};
  let cells=[],score=0,over=false;
  function reset(){cells=Array(16).fill(0);add();add();score=0;api.score(0);over=false;draw()}
  function add(){const f=cells.map((v,i)=>v?-1:i).filter(i=>i>=0);if(!f.length)return;cells[f[(Math.random()*f.length)|0]]=Math.random()<.9?2:4}
  function draw(){
    box.innerHTML="";
    cells.forEach(v=>{
      const t=el("div","");
      t.style.cssText=`display:grid;place-items:center;border-radius:8px;font-weight:600;font-size:${v>999?18:23}px;
        background:${v?COL[v]||"#b52f7a":"rgba(255,255,255,.05)"};color:#fff;
        transition:transform .12s ease;transform:scale(${v?1:.94})`;
      t.textContent=v||"";
      box.appendChild(t);
    });
    if(over){
      const o=el("div","","Game over");
      o.style.cssText="grid-column:1/-1;text-align:center;padding:10px 0 2px;color:var(--txt-dim);font-size:13px";
      box.appendChild(o);
    }
  }
  function slide(row){
    let a=row.filter(v=>v);
    for(let i=0;i<a.length-1;i++)if(a[i]===a[i+1]){a[i]*=2;score+=a[i];a.splice(i+1,1)}
    while(a.length<4)a.push(0);
    return a;
  }
  function move(d){
    if(over)return;
    const before=cells.join(",");
    for(let i=0;i<4;i++){
      let idx=[0,1,2,3].map(j=>d==="left"||d==="right"?i*4+j:j*4+i);
      if(d==="right"||d==="down")idx.reverse();
      const out=slide(idx.map(k=>cells[k]));
      idx.forEach((k,j)=>cells[k]=out[j]);
    }
    if(cells.join(",")!==before){add();api.score(score)}
    else if(!cells.includes(0)&&!canMove())over=true;
    draw();
  }
  function canMove(){
    for(let y=0;y<4;y++)for(let x=0;x<4;x++){
      const v=cells[y*4+x];
      if(x<3&&cells[y*4+x+1]===v)return true;
      if(y<3&&cells[(y+1)*4+x]===v)return true;
    }
    return false;
  }
  const un1=keyBinder(node,d=>{if(["up","down","left","right"].includes(d))move(d)});
  const un2=bindDpad(api,move);
  let sx=0,sy=0;
  const ts=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY};
  const te=e=>{
    const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)<24&&Math.abs(dy)<24)return;
    move(Math.abs(dx)>Math.abs(dy)?(dx>0?"right":"left"):(dy>0?"down":"up"));
  };
  box.addEventListener("touchstart",ts,{passive:true});
  box.addEventListener("touchend",te);
  reset();
  return ()=>{un1();un2();box.remove()};
}

  };

function buildCalc(body){
  const w=el("div","calc");
  const out=el("div","calc-out",'<small id="c-hist"></small><span id="c-now">0</span>');
  const keys=el("div","keys");
  w.append(out,keys); body.appendChild(w);
  let cur="0",prev=null,op=null,fresh=true;
  const now=()=>out.querySelector("#c-now"), hist=()=>out.querySelector("#c-hist");
  const render=()=>{now().textContent=cur;hist().textContent=prev!==null?`${prev} ${op}`:""};
  const calc=()=>{
    const a=parseFloat(prev),b=parseFloat(cur);
    const r=op==="+"?a+b:op==="−"?a-b:op==="×"?a*b:op==="÷"?(b===0?NaN:a/b):b;
    return isFinite(r)?String(+r.toFixed(10)):"Cannot divide by zero";
  };
  [["C","fn"],["±","fn"],["%","fn"],["÷","op"],
   ["7"],["8"],["9"],["×","op"],
   ["4"],["5"],["6"],["−","op"],
   ["1"],["2"],["3"],["+","op"],
   ["0"],["."],["⌫","fn"],["=","eq"]].forEach(([t,k])=>{
    const b=el("button",k||"",t);
    b.addEventListener("click",()=>{
      if(/[0-9]/.test(t)){cur=(fresh||cur==="0")?t:cur+t;fresh=false}
      else if(t==="."){if(fresh){cur="0.";fresh=false}else if(!cur.includes("."))cur+="."}
      else if(t==="C"){cur="0";prev=null;op=null;fresh=true}
      else if(t==="⌫"){cur=cur.length>1?cur.slice(0,-1):"0"}
      else if(t==="±"){cur=cur.startsWith("-")?cur.slice(1):"-"+cur}
      else if(t==="%"){cur=String(parseFloat(cur)/100)}
      else if(t==="="){if(op!==null){cur=calc();prev=null;op=null;fresh=true}}
      else{if(op!==null&&!fresh)cur=calc();prev=cur;op=t;fresh=true}
      render();
    });
    keys.appendChild(b);
  });
  render();
}
